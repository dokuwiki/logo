# The logo as line art, taken from the logo's own design.
#
# One colour, for print. This file says nothing about where anything sits: it
# takes the logo's parts where the logo puts them and changes what each one is
# painted, so the two drawings cannot drift apart.

# The accessible name every drawing of it carries.
title: DokuWiki Logo, line art

# The design this one is laid over, resolved beside this file.
from: logo.yaml

# The two values the drawing is painted in.
#
# This replaces the logo's palette rather than adding to it, so every part the
# logo paints red or green must be decided below.
palette:
  ink: currentColor
  paper: '#ffffff'

# The colour that is not ink: what a part painted in it takes away rather than
# adds, once the drawing is cut into one shape.
ground: paper

# What each part is painted, laid over the logo's parts by id.
#
# The outlines carry the whole drawing here, with no fill behind them to help,
# so they are heavier than the logo's. That weight costs the drawing its room at
# the canvas edge, so the three parts placed against the canvas are moved 4 to
# the right of where the logo puts them, which parts them from the left edge and
# leaves the same room either side. The rest of the drawing hangs off those three
# and follows.
overrides:
  sheet-back-far: {fill: paper, stroke: {width: 25}}
  sheet-back-near: {fill: paper, stroke: {width: 25}}
  sheet-front: {at: {x: 143}, stroke: {width: 30}}

  # The font has one weight, so the letters carry an outline of their own to
  # stand up to the heavier lines round them.
  wordmark: {stroke: {colour: ink, width: 5}}

  # An arrow crosses the sheets' outlines and the other arrow, so it keeps the
  # same room from the ink behind it that the pencils keep.
  arrow-red:
    stroke: {colour: ink, width: 35}
    keyline: {colour: paper, room: 12}
  arrow-green:
    stroke: {colour: ink, width: 35}
    keyline: {colour: paper, room: 12}

  # A pencil is drawn the way the sheets are: paper inside an outline, so it
  # carries a line rather than a mass of ink. The lead is drawn because the barrel
  # is hollow, and it is the only ink the pencil holds.
  #
  # The wood's rim is nothing, so its edge lies along the barrel's and the two
  # draw one line. It adds the two lines that are its own: the cut where the lead
  # ends, and the cut where the wood gives way to the paint. The wood begins
  # earlier than the logo starts it, because here it shows as the gap between
  # those two lines rather than as a pale wedge, and a gap needs more room to
  # read.
  #
  # The pencils are shorter here than the logo draws them, for the same reason the
  # three parts above are moved right: the outline stands half its width outside
  # the silhouette all round, and a blunt end cut flat reaches into the canvas
  # corner by its corner rather than by its middle.
  #
  # The keyline is the room the pencil keeps from the ink behind it. It is
  # measured from the barrel itself, so it carries half the outline as well as
  # the gap.
  pencil-red:
    at: {x: 475.8}
    fill: paper
    bare: paper
    lead: ink
    stroke: {colour: ink, width: 30}
    keyline: {colour: paper, room: 27}
    rim: 0
    woodFrom: 52
    length: 660
    draws: [keyline, barrel, lead, point]
  pencil-green:
    at: {x: 231.9}
    fill: paper
    bare: paper
    lead: ink
    stroke: {colour: ink, width: 30}
    keyline: {colour: paper, room: 27}
    rim: 0
    woodFrom: 52
    length: 660
    draws: [keyline, barrel, lead, point]

# One variant: line art does not adapt to size.
variants:
  - name: line
