# The icon, composed from its parts.
#
# This is a Material Design system icon: one colour, flat, and set on the 24
# square grid that guideline is written in. It does not adapt to size, so its
# two variants are styles rather than levels of detail.
#
# Every part is said the same way the logo's parts are. How each kind looks
# belongs to the kind, in page.js and pencil.js beside this file.

# The accessible name every drawing of it carries.
title: DokuWiki Icon

# The colour the icon is drawn in.
#
# currentColor is not a colour but a promise to take one: the icon is painted in
# the text colour of whatever holds it, as a Material icon is, so one file serves
# a light surface and a dark one. The review page sets that colour to the logo's
# own ink.
palette:
  ink: currentColor

# Edge length of the square canvas, which is the Material grid.
canvas: 24

# The parts, back to front.
#
# The sheet fills the 20 live area: its outline lands on Material's own keyline,
# the 16 by 20 vertical rectangle. The pencils leave the live area, both running
# into the margin at the blunt end, which reads better than holding them inside.
parts:
  # The sheet, its outline broken where a pencil crosses it. "crossedBy" names
  # the parts it breaks for and "clear" how much space to leave around each.
  #
  # Solid, that clear space is the width of every white line in the drawing, so
  # each pencil takes it by name here for the line it is parted by.
  - id: sheet
    is: page
    in: canvas
    at: {x: 3, y: 3}                   # top left corner of the stroke's centre line
    size: {w: 14, h: 18}
    radius: 2
    fill: ink                          # what it is filled with where it is solid
    stroke: {colour: ink, width: 2}    # and drawn in where it is an outline
    clear: &keyline 1
    crossedBy: [pencil-upper, pencil-lower]

  # The pencil across the sheet's top right corner, pointing down and left. It
  # lies at the angle the logo gives its red pencil, and its blunt end runs out
  # into the margin around the live area.
  - id: pencil-upper
    is: pencil
    in: canvas
    at: {x: 11, y: 11}          # where its point sits on the canvas
    turn: -40                   # which way it lies, in degrees
    fill: ink
    parting: *keyline           # the line parting its point from its barrel

  # The pencil out through the sheet's bottom right corner, pointing up and left,
  # at the angle the logo gives its green pencil.
  - id: pencil-lower
    is: pencil
    in: canvas
    at: {x: 7, y: 15}
    turn: 30
    fill: ink
    parting: *keyline

# The two styles. Outlined, the sheet is a line and each pencil is hollow. Solid,
# the sheet is filled and each pencil with it, then taken back out with its clear
# space around it.
#
# Neither says upTo, because neither is picked by size, so no stylesheet is
# written and each gets a file of its own.
variants:
  - name: outlined

  - name: filled
    overrides:
      sheet: {paint: solid}
      pencil-upper: {paint: solid}
      pencil-lower: {paint: solid}
