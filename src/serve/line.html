        <h1>The line art</h1>

        <p>
            The line art version of the logo is meant for printing. Lines have thicker strokes for cutouts or
            engravings.
        </p>


        <p>
            The icon uses a single fillable path element and can easily be coloured by CSS when used inline.
        </p>

        <figure>
            <inline-svg src="dist/dokuwiki-logo-line.svg" size="700"></inline-svg>
            <figcaption>
                <code><a href="../../dist/dokuwiki-logo-line.svg">dokuwiki-logo-line.svg</a></code>
                <small>the whole drawing, at 700px</small>
            </figcaption>
        </figure>
    </section>
