<!doctype html>
<meta charset="utf-8">
<title>The DokuWiki graphics</title>
<link rel="icon" href="../../dist/favicon.ico">
<link rel="stylesheet" href="style.css">
<body>
<header>
    <site-nav></site-nav>
</header>

<main>
    <section>
        <h1>The graphics</h1>

        <p>
            We use the logo in some graphics, which are made for specific uses. They are built by the same build
            system that makes the logo, but are not necessarily made for general use.
        </p>

        <figure>
            <img src="../../dist/graphics/dokuwiki-button.png" width="80" height="15" alt="">
            <figcaption>
                <code><a href="../../dist/graphics/dokuwiki-button.png">dokuwiki-button.png</a></code>
                <small>80 x 15, button in the dokuwiki template footer</small>
            </figcaption>
        </figure>

        <figure>
            <img src="../../dist/graphics/dokuwiki-forum.png" width="241" height="54" alt="">
            <figcaption>
                <code><a href="../../dist/graphics/dokuwiki-forum.png">dokuwiki-forum.png</a></code>
                <small>241 x 54, the header of the <a href="https://forum.dokuwiki.org/">user forum</a></small>
            </figcaption>
        </figure>

        <figure>
            <img src="../../dist/graphics/dokuwiki-translate.png" width="128" height="119" alt="">
            <figcaption>
                <code><a href="../../dist/graphics/dokuwiki-translate.png">dokuwiki-translate.png</a></code>
                <small>128 x 119, icon in the <a href="https://translate.dokuwiki.org/">translation tool</a></small>
            </figcaption>
        </figure>

        <figure>
            <img src="../../dist/graphics/dokuwiki-88x31.png" width="88" height="31" alt="">
            <figcaption>
                <code><a href="../../dist/graphics/dokuwiki-88x31.png">dokuwiki-88x31.png</a></code>
                <small>88 x 31, classic web button</small>
            </figcaption>
        </figure>

        <figure class="wide">
            <img src="../../dist/graphics/dokuwiki-patreon.jpg" width="1200" height="600" alt="">
            <figcaption>
                <code><a href="../../dist/graphics/dokuwiki-patreon.jpg">dokuwiki-patreon.jpg</a></code>
                <small>1200 x 600, The banner of the <a href="https://www.patreon.com/dokuwiki">Patreon page</a></small>
            </figcaption>
        </figure>
    </section>
</main>

<script type="module" src="nav.js"></script>
</body>
