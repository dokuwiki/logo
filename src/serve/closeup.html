<!doctype html>
<meta charset="utf-8">
<title>DokuWiki logo up close</title>
<link rel="icon" href="../../dist/favicon.ico">
<link rel="stylesheet" href="style.css">
<body>
<header>
    <nav></nav>
</header>

<main>
    <section>
        <h1>Close up</h1>

        <p>For debugging the different design levels up close.</p>
    </section>
    <section>
        <h2>large</h2>
        <figure data-level=""></figure>
    </section>

    <section>
        <h2>medium</h2>
        <figure data-level="sz-md"></figure>
    </section>

    <section>
        <h2>small</h2>
        <figure data-level="sz-sm"></figure>
    </section>

    <section>
        <h2>extra small</h2>
        <figure data-level="sz-xs"></figure>
    </section>
</main>

<script type="module">
    /**
     * Paste the drawing into each level's slot and tell it its level by a class.
     * Pasting needs a script because no element loads a file as markup, and a
     * class reaches the drawing only on a copy in this page.
     */
    const FILE = '../../dist/dokuwiki-logo.svg'
    const SIZE = '1024px'
    const source = await fetch(FILE).then((response) => response.text())
    const parsed = new DOMParser().parseFromString(source, 'image/svg+xml')

    for (const slot of document.querySelectorAll('[data-level]')) {
        const svg = document.importNode(parsed.documentElement, true)
        svg.style.width = svg.style.height = SIZE
        if (slot.dataset.level) svg.classList.add(slot.dataset.level)
        slot.append(svg)
    }
</script>
<script type="module" src="nav.js"></script>
</body>
