<!doctype html>
<meta charset="utf-8">
<title>DokuWiki logo up close</title>
<link rel="icon" href="/dist/favicon.ico">
<style>
  body { margin:0; padding:14px 16px 40px; background:#fff; font:13px system-ui; color:#222; }
  h1 { font-size:15px; margin:0 0 8px; }
  h2 { font-size:12px; font-weight:600; margin:26px 0 6px; color:#444; }
  nav { margin:0 0 12px; font:12px system-ui; }
  nav a { color:#36c; margin-right:14px; }
  nav b { margin-right:14px; color:#222; }
  /* Outline the canvas, so the room a part has at its edge shows. */
  .level { display:inline-block; outline:1px solid #ddd; }
  .level > svg { display:block; }
</style>
<body>
<nav>
  <a href="/">every size</a>
  <a href="/src/serve/compare.html">beside the classic one</a>
  <b>up close</b>
</nav>
<h1>dist/dokuwiki-logo.svg at 1024px, one level under another</h1>

<h2>full</h2>
<div class="level" data-level=""></div>

<h2>md — 96px and below</h2>
<div class="level" data-level="sz-md"></div>

<h2>sm — 40px and below</h2>
<div class="level" data-level="sz-sm"></div>

<h2>xs — 20px and below</h2>
<div class="level" data-level="sz-xs"></div>

<script type="module">
  /**
   * Paste the drawing into each level's slot and tell it its level by a class.
   * Pasting needs a script because no element loads a file as markup, and a
   * class reaches the drawing only on a copy in this page.
   */
  const FILE = '/dist/dokuwiki-logo.svg'
  const SIZE = '1024px'
  const source = await fetch(FILE).then((response) => response.text())
  const parsed = new DOMParser().parseFromString(source, 'image/svg+xml')

  for (const slot of document.querySelectorAll('[data-level]')) {
    const svg = document.importNode(parsed.documentElement, true)
    svg.style.width = svg.style.height = SIZE
    if (slot.dataset.level) svg.classList.add(slot.dataset.level)
    slot.append(svg)
  }
</script>
</body>
