<!doctype html>
<meta charset="utf-8">
<title>The DokuWiki logo up close</title>
<link rel="icon" href="../../dist/favicon.ico">
<link rel="stylesheet" href="style.css">
<body>
<header>
    <site-nav></site-nav>
</header>

<main>
    <section>
        <h1>Close-up</h1>

        <p>For debugging the levels of detail up close.</p>
    </section>
    <section>
        <h2>Large</h2>
        <figure><inline-svg src="dist/dokuwiki-logo.svg" size="1024"></inline-svg></figure>
    </section>

    <section>
        <h2>Medium</h2>
        <figure><inline-svg src="dist/dokuwiki-logo.svg" size="1024" class="sz-md"></inline-svg></figure>
    </section>

    <section>
        <h2>Small</h2>
        <figure><inline-svg src="dist/dokuwiki-logo.svg" size="1024" class="sz-sm"></inline-svg></figure>
    </section>

    <section>
        <h2>Extra small</h2>
        <figure><inline-svg src="dist/dokuwiki-logo.svg" size="1024" class="sz-xs"></inline-svg></figure>
    </section>
</main>

<script type="module" src="inline.js"></script>
<script type="module" src="nav.js"></script>
</body>
